[package]
name = "markdown-todo"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
